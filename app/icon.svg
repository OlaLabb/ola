<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&amp;display=swap');
      .brand { font-family: 'Poppins', 'Montserrat', Arial, sans-serif; }
    </style>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#3FB4E8"/>
      <stop offset="1" stop-color="#5CC6F2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#6FD39B"/>
      <stop offset="1" stop-color="#8EE3B0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1024" height="1024" fill="#0D0D0D"/>

  <!-- Olas -->
  <g fill="none" stroke-width="11" stroke-linecap="round">
    <path stroke="url(#blue)"
      d="M232 350 C288 350 304 330 372 330 C440 330 456 370 512 370 C568 370 584 330 652 330 C720 330 736 360 790 345"/>
    <path stroke="url(#green)"
      d="M262 375 C318 375 334 355 402 355 C470 355 486 395 542 395 C598 395 614 355 682 355 C750 355 766 375 820 368"/>
  </g>

  <!-- Nombre -->
  <text class="brand" x="512" y="610" text-anchor="middle"
        font-size="196" font-weight="800" fill="#FFFFFF" letter-spacing="-4">ola lab</text>

  <!-- Firma GIMTI -->
  <g class="brand" fill="#FFFFFF">
    <text x="410" y="720" text-anchor="end" font-size="40" font-weight="300" fill="#8C8C8C">by</text>
    <text x="462" y="720" font-size="54" font-weight="600" letter-spacing="-1">gimti</text>
    <text x="592" y="718" font-size="42" font-weight="600" letter-spacing="-2">&lt;/&gt;</text>
  </g>
</svg>
